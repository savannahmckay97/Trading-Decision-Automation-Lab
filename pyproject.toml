[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-decision-automation-lab"
version = "0.2.0"
description = "Independent observation-first trading decision research system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["PyYAML>=6"]

[project.scripts]
trading-decision-observer = "market_observer.cli:main"
trading-decision-replay = "market_observer.replay:main"

[tool.setuptools]
packages = ["market_observer"]
