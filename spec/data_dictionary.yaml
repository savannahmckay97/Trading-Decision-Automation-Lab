derived_fields:
  feature.completed_15m: {type: boolean, producer: T1_COMPLETED_CANDLE}
  feature.resistance: {type: decimal, unit: USDT_per_TAO, producer: T1_LOCAL_LEVELS}
  feature.support: {type: decimal, unit: USDT_per_TAO, producer: T1_LOCAL_LEVELS}
  feature.atr_15m: {type: decimal, unit: USDT_per_TAO, producer: T1_ATR}
  feature.volume_percentile: {type: decimal, range: [0, 1], producer: T1_VOLUME_PERCENTILE}
  feature.oi_change_15m_pct: {type: decimal, unit: percent, producer: T1_OI_CHANGE}
  feature.oi_change_60m_pct: {type: decimal, unit: percent, producer: T1_OI_CHANGE}
  feature.taker_ratio: {type: decimal, producer: T1_TAKER_FLOW}
  feature.taker_buy_share: {type: decimal, range: [0, 1], producer: T1_TAKER_FLOW}
  feature.funding_rate: {type: decimal, producer: T1_FUNDING_CROWDING}
  feature.funding_percentile: {type: decimal, range: [0, 1], producer: T1_FUNDING_CROWDING}
  feature.global_long_account_share: {type: decimal, range: [0, 1], producer: T1_POSITIONING}
  feature.top_long_account_share: {type: decimal, range: [0, 1], producer: T1_POSITIONING}
  feature.top_long_position_share: {type: decimal, range: [0, 1], producer: T1_POSITIONING}
  feature.return_15m_pct: {type: decimal, unit: percent, producer: feature_engine}
  feature.spread_bps: {type: decimal, unit: basis_points, producer: feature_engine}
  feature.price_oi_quadrant: {type: enum, producer: T2_PRICE_OI_QUADRANT}
  score.breakout_quality: {type: integer, range: [-5, 5], producer: T2_BREAKOUT_QUALITY}

quality_contracts:
  - contract_id: synchronized_15m
    requirement: >-
      Candle return, OI change, taker flow, and positioning used in one decision
      must reference the same completed interval or an explicitly documented as-of join.
  - contract_id: no_silent_forward_fill
    requirement: Missing derivatives or venue values may not be silently forward-filled.
  - contract_id: raw_provenance
    requirement: Every normalized record preserves source, endpoint, symbol, event time, receive time, and raw-record identifier.
  - contract_id: book_sequence
    requirement: Diff-depth updates are unusable after a sequence gap until a fresh snapshot and replay restore continuity.
  - contract_id: quote_currency
    requirement: USD and USDT values remain labeled; parity may be measured but never assumed silently.

