dictionary:
  name: market_observer_data_dictionary
  version: 0.1.0
  generated_at: "2026-09-17T03:30:00Z"
  canonical_timezone: UTC
  timestamp_unit: milliseconds_since_unix_epoch
  numeric_policy: decimal_for_money_and_quantity
  null_policy: preserve_null_and_raise_quality_flag
  raw_data_policy: append_only
  symbols:
    research_symbol: TAOUSDT
    executable_symbol: TAO/USD
    research_venue: binance_usds_m_futures
    executable_venue: kraken_spot_margin

sources:
  binance_public:
    authentication: none
    role: research_context
    transport: [REST, WebSocket]
    required_capabilities:
      - klines_15m
      - aggregate_trades
      - book_ticker
      - diff_depth
      - open_interest
      - open_interest_history
      - funding_history
      - global_long_short_accounts
      - top_trader_accounts
      - top_trader_positions
      - taker_buy_sell_volume
  kraken_public:
    authentication: none
    role: executable_price_confirmation
    transport: [REST, WebSocket]
    required_capabilities: [ticker, trades, book, ohlc]
  kraken_private_read_only:
    authentication: api_key_read_only
    role: account_and_execution_truth
    permissions: [query_funds, query_open_orders, query_closed_orders, query_trades, query_positions]
    forbidden_permissions: [withdraw, deposit_address_management, api_key_management]
    required_for_observation_v0_1: false
  official_event_sources:
    authentication: none_or_provider_specific
    role: scheduled_event_ground_truth
    required_for_observation_v0_1: false

fields:
  system.mode:
    type: enum
    values: [historical_replay, observation_only, paper, shadow, guarded_live]
    source: local_configuration
    unit: none
    freshness_ms: null
    required_by: [T0_OBSERVATION_ONLY]

  clock.exchange_time:
    type: timestamp
    source: venue_server_time
    unit: ms
    freshness_ms: 5000
    required_by: [T1_COMPLETED_CANDLE]

  market.binance.last_price:
    type: decimal
    source: binance_public
    unit: USDT_per_TAO
    frequency: tick
    freshness_ms: 5000
    constraints: {exclusive_minimum: 0}
    required_by: [T0_VENUE_CONFIRMATION]

  market.kraken.last_price:
    type: decimal
    source: kraken_public
    unit: USD_per_TAO
    frequency: tick
    freshness_ms: 5000
    constraints: {exclusive_minimum: 0}
    required_by: [T0_VENUE_CONFIRMATION, SETUP_BREAKOUT_RETEST_V1]

  market.kraken.bid_price:
    type: decimal
    source: kraken_public
    unit: USD_per_TAO
    frequency: tick
    freshness_ms: 5000
    constraints: {exclusive_minimum: 0}
    required_by: [T0_VENUE_CONFIRMATION, T0_SPREAD_BUDGET]

  market.kraken.ask_price:
    type: decimal
    source: kraken_public
    unit: USD_per_TAO
    frequency: tick
    freshness_ms: 5000
    constraints: {exclusive_minimum: 0, relation: ask_price_gte_bid_price}
    required_by: [T0_VENUE_CONFIRMATION, T0_SPREAD_BUDGET]

  candle.binance_15m.open_time:
    type: timestamp
    source: binance_public
    endpoint_family: klines_15m
    unit: ms
    frequency: 15m
    freshness_ms: 960000
    required_by: [T1_COMPLETED_CANDLE]

  candle.binance_15m.close_time:
    type: timestamp
    source: binance_public
    endpoint_family: klines_15m
    unit: ms
    frequency: 15m
    freshness_ms: 960000
    required_by: [T1_COMPLETED_CANDLE]

  series.binance_15m.high:
